plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.shopson'
version = '0.0.1-SNAPSHOT'
SPRING_BOOT_VERSION = '4.1.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation "org.springframework.boot:spring-boot-starter-batch:${SPRING_BOOT_VERSION}"
	implementation "org.springframework.boot:spring-boot-starter-restclient:${SPRING_BOOT_VERSION}"
	implementation "org.springframework.boot:spring-boot-starter-security:${SPRING_BOOT_VERSION}"
	implementation "org.springframework.boot:spring-boot-starter-validation:${SPRING_BOOT_VERSION}"
	implementation "org.springframework.boot:spring-boot-starter-webmvc:${SPRING_BOOT_VERSION}"
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0"
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation "org.springframework.boot:spring-boot-starter-batch-test:${SPRING_BOOT_VERSION}"
	testImplementation "org.springframework.boot:spring-boot-starter-restclient-test:${SPRING_BOOT_VERSION}"
	testImplementation "org.springframework.boot:spring-boot-starter-security-test:${SPRING_BOOT_VERSION}"
	testImplementation "org.springframework.boot:spring-boot-starter-validation-test:${SPRING_BOOT_VERSION}"
	testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test:${SPRING_BOOT_VERSION}"
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
